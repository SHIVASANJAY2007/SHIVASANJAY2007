<svg xmlns="http://www.w3.org/2000/svg" width="350" height="60" viewBox="0 0 350 60">
  <defs>
    <style type="text/css">
      .neo-shadow { fill: #FE1E27; }
      .neo-box {
        fill: #FFFFFF;
        stroke: #000000;
        stroke-width: 3;
      }
      .neo-divider {
        stroke: #000000;
        stroke-width: 3;
      }
      .neo-text {
        font-family: "Impact", "Arial Black", -apple-system, sans-serif;
        font-size: 17px;
        font-weight: 900;
        fill: #000000;
        letter-spacing: 1.5px;
      }
      .icon-path {
        stroke: #000000;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      @media (prefers-color-scheme: dark) {
        .neo-box {
          fill: #0D1117;
          stroke: #F0F6FC;
        }
        .neo-divider { stroke: #F0F6FC; }
        .neo-text { fill: #F0F6FC; }
        .icon-path { stroke: #F0F6FC; }
      }
    </style>
  </defs>

  <!-- Shadow Box -->
  <rect x="8" y="8" width="310" height="42" class="neo-shadow" rx="3" />

  <!-- Main Box -->
  <rect x="4" y="4" width="310" height="42" class="neo-box" rx="3" />

  <!-- Divider -->
  <line x1="48" y1="4" x2="48" y2="46" class="neo-divider" />

  <!-- Centered Icon -->
  <g transform="translate(14, 13)">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" class="icon-path"/>
  </g>

  <!-- Title Text -->
  <text x="60" y="31" class="neo-text">RANDOM DEV QUOTE</text>
</svg>
