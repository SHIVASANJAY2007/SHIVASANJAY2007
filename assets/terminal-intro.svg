<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="300" viewBox="0 0 650 300">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#050505"/>
    </linearGradient>
  </defs>
  
  <!-- Terminal Window -->
  <rect x="0" y="0" width="650" height="300" rx="12" ry="12" fill="url(#termBg)" stroke="#222222" stroke-width="1"/>
  
  <!-- Terminal Title Bar -->
  <rect x="0" y="0" width="650" height="36" rx="12" ry="12" fill="#0d0d0d"/>
  <rect x="0" y="24" width="650" height="12" fill="#0d0d0d"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Terminal Title -->
  <text x="325" y="23" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="12" fill="#6b7280">
    shivasanjay@dev — zsh
  </text>
  
  <!-- Terminal Content -->
  <g font-family="'SF Mono', 'JetBrains Mono', 'Consolas', monospace" font-size="13">
    <!-- Command 1 -->
    <text x="20" y="65" fill="#FE1E27">❯</text>
    <text x="40" y="65" fill="#ffffff">cat profile.json</text>
    
    <!-- JSON Output -->
    <text x="20" y="95" fill="#FE1E27">{</text>
    
    <text x="35" y="120" fill="#FE1E27">"name"</text>
    <text x="90" y="120" fill="#ffffff">:</text>
    <text x="100" y="120" fill="#ffffff">"Shiva Sanjay N D"</text>
    <text x="245" y="120" fill="#ffffff">,</text>
    
    <text x="35" y="145" fill="#FE1E27">"role"</text>
    <text x="85" y="145" fill="#ffffff">:</text>
    <text x="95" y="145" fill="#ffffff">"Full-Stack Dev &amp; Workflow Automator"</text>
    <text x="365" y="145" fill="#ffffff">,</text>
    
    <text x="35" y="170" fill="#FE1E27">"location"</text>
    <text x="115" y="170" fill="#ffffff">:</text>
    <text x="125" y="170" fill="#ffffff">"Tamil Nadu, India 🇮🇳"</text>
    <text x="285" y="170" fill="#ffffff">,</text>
    
    <text x="35" y="195" fill="#FE1E27">"focus"</text>
    <text x="90" y="195" fill="#ffffff">:</text>
    <text x="100" y="195" fill="#ffffff">"Architecting ERP Systems"</text>
    <text x="360" y="195" fill="#ffffff">,</text>
    
    <text x="35" y="220" fill="#FE1E27">"goal"</text>
    <text x="80" y="220" fill="#ffffff">:</text>
    <text x="90" y="220" fill="#ffffff">"Impactful automation at scale"</text>
    
    <text x="20" y="245" fill="#FE1E27">}</text>
    
    <!-- New Command Line -->
    <text x="20" y="275" fill="#FE1E27">❯</text>
    <rect x="40" y="263" width="10" height="16" fill="#FE1E27">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
