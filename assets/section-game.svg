<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="60" viewBox="0 0 400 60">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800&amp;family=Fira+Code:wght@600&amp;display=swap');
      .hud-title {
        font-family: 'Orbitron', 'Fira Code', monospace;
        font-size: 17px;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }
      .hud-sub {
        font-family: 'Fira Code', monospace;
        font-size: 8px;
        font-weight: 600;
        fill: #FE1E27;
        letter-spacing: 1px;
        opacity: 0.85;
      }
      .hud-icon {
        stroke: #FE1E27;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        filter: drop-shadow(0px 0px 3px rgba(254, 30, 39, 0.6));
      }
      .hud-brackets {
        stroke: #444444;
        stroke-width: 1.5;
        fill: none;
        opacity: 0.6;
      }
      .hud-line {
        stroke: url(#lineGrad);
        stroke-width: 2;
        stroke-linecap: round;
      }
    </style>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FE1E27" />
      <stop offset="60%" stop-color="#FE1E27" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FE1E27" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left HUD Icon Bracket -->
  <path d="M 6 10 L 2 10 L 2 40 L 6 40" class="hud-brackets" />
  <path d="M 40 10 L 44 10 L 44 40 L 40 40" class="hud-brackets" />
  
  <!-- Custom SVG Icon -->
  <svg x="10" y="11" width="26" height="26" viewBox="0 0 24 24">
    
        <rect x="2" y="6" width="20" height="12" rx="3" class="hud-icon"/>
        <path d="M6 12h4M8 10v4" class="hud-icon"/>
        <circle cx="15" cy="12" r="1.5" fill="#FE1E27"/>
        <circle cx="18" cy="12" r="1.5" fill="#FE1E27"/>
        
  </svg>
  
  <!-- Text -->
  <text x="60" y="25" class="hud-title">CONTRIBUTION GAMING</text>
  <text x="60" y="40" class="hud-sub">SYS.PLAY // ACTIVE_ARENA</text>
  
  <!-- Bottom Accent Line -->
  <line x1="60" y1="46" x2="320" y2="46" class="hud-line" />
</svg>
