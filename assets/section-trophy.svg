<svg xmlns="http://www.w3.org/2000/svg" width="350" height="60" viewBox="0 0 350 60">
  <defs>
    <style type="text/css">
      .neo-shadow { fill: #FE1E27; }
      .neo-box {
        fill: #FFFFFF;
        stroke: #000000;
        stroke-width: 3;
      }
      .neo-divider {
        stroke: #000000;
        stroke-width: 3;
      }
      .neo-text {
        font-family: "Impact", "Arial Black", -apple-system, sans-serif;
        font-size: 17px;
        font-weight: 900;
        fill: #000000;
        letter-spacing: 1.5px;
      }
      .icon-path {
        stroke: #000000;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      @media (prefers-color-scheme: dark) {
        .neo-box {
          fill: #0D1117;
          stroke: #F0F6FC;
        }
        .neo-divider { stroke: #F0F6FC; }
        .neo-text { fill: #F0F6FC; }
        .icon-path { stroke: #F0F6FC; }
      }
    </style>
  </defs>

  <!-- Shadow Box -->
  <rect x="8" y="8" width="310" height="42" class="neo-shadow" rx="3" />

  <!-- Main Box -->
  <rect x="4" y="4" width="310" height="42" class="neo-box" rx="3" />

  <!-- Divider -->
  <line x1="48" y1="4" x2="48" y2="46" class="neo-divider" />

  <!-- Centered Icon -->
  <g transform="translate(14, 13)">
    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" class="icon-path"/>
    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" class="icon-path"/>
    <path d="M4 22h16" class="icon-path"/>
    <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34" class="icon-path"/>
    <path d="M12 2a5 5 0 0 1 5 5v5a5 5 0 0 1-5 5 5 5 0 0 1-5-5V7a5 5 0 0 1 5-5z" class="icon-path"/>
  </g>

  <!-- Title Text -->
  <text x="60" y="31" class="neo-text">ACHIEVEMENTS</text>
</svg>
