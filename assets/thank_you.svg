<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:ital,wght@1,900&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      
      .hud-title {{
        font-family: 'Orbitron', sans-serif;
        font-size: 42px;
        font-style: italic;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 6px;
        text-anchor: middle;
        filter: drop-shadow(0px 0px 8px rgba(254, 30, 39, 0.75));
      }}
      
      .hud-sub {{
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #FE1E27;
        letter-spacing: 4px;
        text-anchor: middle;
        filter: drop-shadow(0px 0px 3px rgba(254, 30, 39, 0.6));
      }}
      
      .hud-micro {{
        font-family: 'Fira Code', monospace;
        font-size: 9px;
        font-weight: 500;
        fill: #888888;
        letter-spacing: 2px;
        opacity: 0.7;
      }}
      
      .hud-border {{
        stroke: #FE1E27;
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0px 0px 3px rgba(254, 30, 39, 0.4));
      }}
      
      .hud-grid {{
        stroke: #333333;
        stroke-width: 0.5;
        opacity: 0.4;
      }}
      
      .hud-chevron {{
        fill: #FE1E27;
        filter: drop-shadow(0px 0px 3px rgba(254, 30, 39, 0.6));
      }}
    </style>
  </defs>

  <!-- Technical grid in background -->
  <line x1="40" y1="80" x2="760" y2="80" class="hud-grid" stroke-dasharray="2 8" />
  
  <!-- Corner Brackets -->
  <path d="M 50 30 L 30 30 L 30 50" class="hud-border" />
  <path d="M 750 30 L 770 30 L 770 50" class="hud-border" />
  <path d="M 30 110 L 30 130 L 50 130" class="hud-border" />
  <path d="M 770 110 L 770 130 L 750 130" class="hud-border" />
  
  <!-- Horizontal Lines with gaps -->
  <line x1="80" y1="30" x2="720" y2="30" class="hud-border" stroke-dasharray="100 20 200 20 100" />
  <line x1="80" y1="130" x2="720" y2="130" class="hud-border" stroke-dasharray="100 20 200 20 100" />
  
  <!-- Micro HUD labels at the top -->
  <text x="35" y="22" class="hud-micro">SYS.PORT_STATUS: CLOSED</text>
  <text x="610" y="22" class="hud-micro" text-anchor="start">CONNECTION: SECURED</text>
  
  <!-- Left Chevrons -->
  <g class="hud-chevron" transform="translate(140, 58)">
    <path d="M 0 0 L 10 10 L 0 20 L 4 20 L 14 10 L 4 0 Z" />
    <path d="M 10 0 L 20 10 L 10 20 L 14 20 L 24 10 L 14 0 Z" opacity="0.7" />
    <path d="M 20 0 L 30 10 L 20 20 L 24 20 L 34 10 L 24 0 Z" opacity="0.4" />
  </g>
  
  <!-- Right Chevrons -->
  <g class="hud-chevron" transform="translate(630, 58) scale(-1, 1)">
    <path d="M 0 0 L 10 10 L 0 20 L 4 20 L 14 10 L 4 0 Z" />
    <path d="M 10 0 L 20 10 L 10 20 L 14 20 L 24 10 L 14 0 Z" opacity="0.7" />
    <path d="M 20 0 L 30 10 L 20 20 L 24 20 L 34 10 L 24 0 Z" opacity="0.4" />
  </g>
  
  <!-- Center Main Text -->
  <text x="400" y="78" class="hud-title">THANK YOU</text>
  
  <!-- Subtitle -->
  <text x="400" y="112" class="hud-sub">FOR VISITING MY PROFILE</text>
  
  <!-- Micro HUD labels at the bottom -->
  <text x="35" y="148" class="hud-micro">SESSION_LOG: ENDED</text>
  <text x="685" y="148" class="hud-micro" text-anchor="start">EST.2007</text>
</svg>
