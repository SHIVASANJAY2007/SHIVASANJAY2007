<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;family=Satisfy&amp;display=swap');
      
      .main-text {{
        font-family: 'Orbitron', sans-serif;
        font-size: 72px;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 12px;
        text-anchor: middle;
        filter: drop-shadow(0px 0px 8px rgba(254, 30, 39, 0.6));
      }}
      
      .cursive-text {{
        font-family: 'Satisfy', cursive;
        font-size: 56px;
        fill: #FE1E27;
        text-anchor: middle;
        filter: drop-shadow(0px 0px 10px rgba(254, 30, 39, 0.9)) drop-shadow(0px 0px 3px rgba(254, 30, 39, 0.9));
      }}
      
      .hud-sub {{
        font-family: 'Orbitron', sans-serif;
        font-size: 10px;
        fill: #888888;
        letter-spacing: 5px;
        text-anchor: middle;
        opacity: 0.7;
      }}
      
      .hud-line {{
        stroke: #FE1E27;
        stroke-width: 1.5;
        opacity: 0.3;
        stroke-dasharray: 4 4;
      }}
      
      .hud-dot {{
        fill: #FE1E27;
        opacity: 0.7;
      }}
    </style>
  </defs>
  
  <!-- Subtle cybernetic lines in the background -->
  <line x1="50" y1="120" x2="200" y2="120" class="hud-line" />
  <circle cx="200" cy="120" r="3" class="hud-dot" />
  
  <line x1="600" y1="120" x2="750" y2="120" class="hud-line" />
  <circle cx="600" cy="120" r="3" class="hud-dot" />
  
  <!-- Bold HUD Main Text -->
  <text x="408" y="125" class="main-text">THANK YOU</text>
  
  <!-- Glowing Overlay Cursive Text -->
  <text x="400" y="165" class="cursive-text">for visiting</text>
  
  <!-- Bottom HUD Metadata -->
  <text x="400" y="210" class="hud-sub">SYS.DISCONNECT // PORT_CLOSED_SUCCESSFULLY</text>
</svg>
